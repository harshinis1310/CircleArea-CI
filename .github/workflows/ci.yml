
name: Java Circle Area CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build and Run JUnit Tests
        run: mvn clean verify

      - name: Build Docker Image
        run: docker build -t circle-area-ci:latest .

      - name: Save Docker Image
        run: docker save -o circle-area-ci.tar circle-area-ci:latest

      - name: Upload Docker Image
        uses: actions/upload-artifact@v4
        with:
          name: circle-area-docker-image
          path: circle-area-ci.tar
